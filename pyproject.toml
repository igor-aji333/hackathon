[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-mcp"
version = "0.2.0"
description = "FastMCP server for querying FAA airport runway data."
requires-python = ">=3.13"
license = {text = "Public Domain"}
authors = [
    {name = "Igor Filippov"}
] # <-- FIXED

dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "httpx>=0.27.0",       # <-- FIXED: Replaced requests with httpx
    "python-dotenv>=1.0.0",# <-- FIXED: Moved from dev to main
    "beautifulsoup4>=4.12.0",
    "fastmcp>=0.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "starlette>=0.35.0",
    "uvicorn>=0.25.0"
] # <-- FIXED

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
] # <-- FIXED
s3 = [
    "boto3>=1.34.0"        # <-- FIXED: Added missing [s3] target from DEPLOYMENT.md
]

[dependency-groups]
dev = [
    "arize-phoenix>=18.0.0",
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "openinference-instrumentation-langchain>=0.1.67",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0"
] # <-- FIXED