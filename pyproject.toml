[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-mcp"
version = "0.3.0"
description = "FastMCP server for querying FAA NASR airport, runway, and runway-end data."
requires-python = ">=3.11"
license = "Unlicense"
authors = [
    {name = "Igor Filippov"}
]

dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "starlette>=0.35.0",
    "uvicorn>=0.25.0",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.34.0",
]

[project.scripts]
airport-mcp = "airport_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.0",
]
eval = [
    "arize-phoenix>=18.0.0",
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.3.5",
    "openinference-instrumentation-langchain>=0.1.67",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools]
packages = ["airport_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",
]
