[project]
name = "airport-mcp"
version = "0.1.0"
description = "MCP server for querying airport runway data"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.3.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airport_mcp"]