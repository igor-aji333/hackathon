# Databricks Apps configuration.
# https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
#
# Databricks injects DATABRICKS_APP_PORT; when it is set, the server serves
# streamable HTTP on 0.0.0.0:<port> with endpoints:
#   /mcp     MCP (streamable HTTP)
#   /health  readiness: {"status": "ready" | "initializing", "data_cycle": ...}
#
# The synced source lives in /app/python/source_code; put it on PYTHONPATH so
# the airport_mcp package is importable without installing it.
command:
  - "/bin/sh"
  - "-c"
  - "export PYTHONPATH=/app/python/source_code:$PYTHONPATH && python -m airport_mcp.server"
